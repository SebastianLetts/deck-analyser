<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#333"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- PDA Body -->
  <rect x="12" y="4" width="40" height="56" rx="5" ry="5" fill="url(#body)" stroke="#111" stroke-width="1.5"/>
  <!-- Outer bezel -->
  <rect x="14" y="6" width="36" height="52" rx="4" ry="4" fill="none" stroke="#444" stroke-width="0.5"/>
  <!-- Screen -->
  <rect x="17" y="10" width="30" height="28" rx="2" ry="2" fill="url(#screen)" stroke="#222" stroke-width="1"/>
  <!-- Screen shine -->
  <rect x="17" y="10" width="30" height="28" rx="2" ry="2" fill="url(#shine)"/>
  <!-- Chart bars on screen (representing deck analysis) -->
  <rect x="21" y="28" width="4" height="7" rx="0.5" fill="#8a8a8a" opacity="0.9"/>
  <rect x="27" y="22" width="4" height="13" rx="0.5" fill="#aaa" opacity="0.9"/>
  <rect x="33" y="25" width="4" height="10" rx="0.5" fill="#999" opacity="0.9"/>
  <rect x="39" y="18" width="4" height="17" rx="0.5" fill="#bbb" opacity="0.9"/>
  <!-- Trend line across chart -->
  <polyline points="23,27 29,21 35,24 41,17" fill="none" stroke="#ddd" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Stylus slot line -->
  <line x1="44" y1="8" x2="44" y2="14" stroke="#555" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Navigation buttons area -->
  <rect x="22" y="42" width="20" height="3" rx="1.5" fill="#2a2a2a" stroke="#444" stroke-width="0.5"/>
  <!-- D-pad / center button -->
  <circle cx="32" cy="50" r="4" fill="#2a2a2a" stroke="#444" stroke-width="0.5"/>
  <circle cx="32" cy="50" r="1.8" fill="#333" stroke="#555" stroke-width="0.4"/>
  <!-- Side buttons -->
  <circle cx="24" cy="50" r="1.5" fill="#2a2a2a" stroke="#444" stroke-width="0.4"/>
  <circle cx="40" cy="50" r="1.5" fill="#2a2a2a" stroke="#444" stroke-width="0.4"/>
</svg>
